x-airflow-logging: &airflow-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  dwpostgres:
    image: postgres:17rc1-alpine3.19
    restart: unless-stopped
    container_name: dwpronto_postgres
    env_file: ./.env
    environment:
      PGDATA: /var/lib/postgresql/data/pgdata
    command:
      - postgres
      - -c
      - temp_file_limit=20GB
      - -c
      - log_temp_files=1GB
    ports:
      - "5434:5432"
    volumes:
      - postgres-volume:/var/lib/postgresql/data
    networks:
      - airflow
    logging: *airflow-logging
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  webserver:
    build:
      context: .
      dockerfile: Dockerfile
    env_file: ./.env
    ports:
      - "8081:8080"
    environment:
      - _PIP_ADDITIONAL_REQUIREMENTS=oracledb==1.1.0
      - POSTGRES_HOST=dwpostgres
      - AIRFLOW__CORE__HOSTNAME_CALLABLE=airflow.utils.net.getfqdn
    volumes:
      - ./dags:/usr/local/airflow/dags
      - ./dbt_prontocardio:/usr/local/airflow/dbt
      - ./dbt_dw_entradas:/usr/local/airflow/dbt
      - ./dbt_dw_repasse:/usr/local/airflow/dbt
      - ./include/oracle:/usr/local/airflow/.oracle/instantclient_19_23/
      - ./include/postgresql:/usr/local/airflow/.postgresql/data/instantclient_17_0/
      - ./script_ingestao:/usr/local/airflow/script_ingestao
      - ./.dlt:/usr/local/airflow/.dlt
    depends_on:
      dwpostgres:
        condition: service_healthy
    networks:
      - airflow
    restart: unless-stopped
    logging: *airflow-logging
    healthcheck:
      test: ["CMD", "curl", "http://localhost:8080/health"]
      interval: 30s
      timeout: 30s
      retries: 5

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - AIRFLOW__CORE__HOSTNAME_CALLABLE=airflow.utils.net.getfqdn
    volumes:
      - ./script_ingestao:/usr/local/airflow/script_ingestao
      - ./.dlt:/usr/local/airflow/.dlt
      - ./dbt_dw_entradas:/usr/local/airflow/dbt
      - ./dbt_dw_repasse:/usr/local/airflow/dbt
    depends_on:
      dwpostgres:
        condition: service_healthy
    networks:
      - airflow
    restart: unless-stopped
    logging: *airflow-logging
    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type SchedulerJob --local"]
      interval: 30s
      timeout: 20s
      retries: 5
      start_period: 60s

  triggerer:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ./script_ingestao:/usr/local/airflow/script_ingestao
      - ./.dlt:/usr/local/airflow/.dlt
      - ./dbt_dw_entradas:/usr/local/airflow/dbt
      - ./dbt_dw_repasse:/usr/local/airflow/dbt
    depends_on:
      dwpostgres:
        condition: service_healthy
    networks:
      - airflow
    restart: unless-stopped
    logging: *airflow-logging

volumes:
  postgres-volume:
    name: dwprontocardio-postgres-data

networks:
  airflow:
    name: airflow
    driver: bridge
    external: false
